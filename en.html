<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yaser Bawaked</title>
  <meta name="description" content="Yaser Bawaked - Senior Sales Specialist - Digital Business Card">
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <meta name="theme-color" content="#09090B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="animations.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body class="card-page-body">

  <div class="aurora-bg" aria-hidden="true">
    <span class="aurora-blob aurora-blob--1"></span>
    <span class="aurora-blob aurora-blob--2"></span>
    <span class="aurora-blob aurora-blob--3"></span>
  </div>

  <main class="card">

    <!-- 1: Profile image -->
    <div class="profile-image-wrapper">
      <img
        src="profile.jpg"
        alt="Yaser Bawaked profile photo"
        class="profile-image"
        width="800"
        height="1200"
      >
    </div>

    <!-- 2: Full name -->
    <h1 class="name">Yaser Bawaked</h1>

    <!-- 3: Job title -->
    <p class="job-title">Senior Sales Specialist</p>

    <!-- 4: Email -->
    <a href="mailto:yas.5050@hotmail.com" class="email-link">
      yas.5050@hotmail.com
    </a>

    <!-- 5: Add to Contacts button -->
    <a
      href="yaser.vcf"
      type="text/vcard"
      class="btn btn--primary btn--add-contact"
    >
      <img src="contact.svg" alt="" class="btn__icon" aria-hidden="true">
      <span>Add to Contacts</span>
    </a>

    <!-- 6/7: Contact & social cards (Call is the first card in this section) -->
    <nav class="contact-cards" aria-label="Contact and social links">

      <a href="tel:+966599938393" class="contact-card contact-card--call">
        <img src="phone.svg" alt="" class="contact-card__icon" aria-hidden="true">
        <span class="contact-card__text">
          <span class="contact-card__title">Call</span>
          <span class="contact-card__desc">Direct call</span>
        </span>
        <span class="contact-card__arrow" aria-hidden="true">&rarr;</span>
      </a>

      <a href="https://wa.me/966599938393" class="contact-card contact-card--whatsapp" target="_blank" rel="noopener noreferrer">
        <img src="whatsapp.svg" alt="" class="contact-card__icon" aria-hidden="true">
        <span class="contact-card__text">
          <span class="contact-card__title">WhatsApp</span>
          <span class="contact-card__desc">Chat instantly</span>
        </span>
        <span class="contact-card__arrow" aria-hidden="true">&rarr;</span>
      </a>

      <a href="https://www.facebook.com/share/1E4n5wzepM/" class="contact-card contact-card--facebook" target="_blank" rel="noopener noreferrer">
        <img src="facebook.svg" alt="" class="contact-card__icon" aria-hidden="true">
        <span class="contact-card__text">
          <span class="contact-card__title">Facebook</span>
          <span class="contact-card__desc">Personal Profile</span>
        </span>
        <span class="contact-card__arrow" aria-hidden="true">&rarr;</span>
      </a>

      <a href="https://www.instagram.com/yaserbawaked/" class="contact-card contact-card--instagram" target="_blank" rel="noopener noreferrer">
        <img src="instagram.svg" alt="" class="contact-card__icon" aria-hidden="true">
        <span class="contact-card__text">
          <span class="contact-card__title">Instagram</span>
          <span class="contact-card__desc">Latest Posts</span>
        </span>
        <span class="contact-card__arrow" aria-hidden="true">&rarr;</span>
      </a>

      <a href="https://www.tiktok.com/@yhsb2017" class="contact-card contact-card--tiktok" target="_blank" rel="noopener noreferrer">
        <img src="tiktok.svg" alt="" class="contact-card__icon" aria-hidden="true">
        <span class="contact-card__text">
          <span class="contact-card__title">TikTok</span>
          <span class="contact-card__desc">Watch my videos</span>
        </span>
        <span class="contact-card__arrow" aria-hidden="true">&rarr;</span>
      </a>

      <a href="https://snapchat.com/t/oWB2qmmV" class="contact-card contact-card--snapchat" target="_blank" rel="noopener noreferrer">
        <img src="snapchat.svg" alt="" class="contact-card__icon" aria-hidden="true">
        <span class="contact-card__text">
          <span class="contact-card__title">Snapchat</span>
          <span class="contact-card__desc">Add me on Snap</span>
        </span>
        <span class="contact-card__arrow" aria-hidden="true">&rarr;</span>
      </a>

      <a href="https://www.linkedin.com/in/ياسر-باواكد-730706308" class="contact-card contact-card--linkedin" target="_blank" rel="noopener noreferrer">
        <img src="linkedin.svg" alt="" class="contact-card__icon" aria-hidden="true">
        <span class="contact-card__text">
          <span class="contact-card__title">LinkedIn</span>
          <span class="contact-card__desc">Professional Profile</span>
        </span>
        <span class="contact-card__arrow" aria-hidden="true">&rarr;</span>
      </a>

    </nav>

    <!-- 8: Language switch button -->
    <footer class="language-switch">
      <a href="ar.html" class="lang-btn">العربية</a>
    </footer>

  </main>

  <script src="ripple.js" defer></script>
  <script src="language.js" defer></script>
  <script src="main.js" defer></script>
</body>
</html>
